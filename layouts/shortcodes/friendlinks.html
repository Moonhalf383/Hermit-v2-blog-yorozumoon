{{/* layouts/shortcodes/friendlinks.html */}}
<div class="friend-links-container">
    {{ range hugo.Data.links.list }}
    <a href="{{ .url }}" target="_blank" rel="noopener noreferrer" class="friend-card">
        <div class="friend-left">
            <img src="{{ .avatar }}" alt="{{ .name }}" class="friend-avatar" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='/images/friend_default.png'">
        </div>
        <div class="friend-right">
            <div class="friend-name">{{ .name }}</div>
            <div class="friend-desc">{{ .desc }}</div>
        </div>
    </a>
    {{ end }}
</div>
